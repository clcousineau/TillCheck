<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>Till Counter</title>
  <style>
    :root { font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial; }
    body { margin: 0; background:#0f1115; color:#f5f6f7; }
    header { padding: 16px; font-weight: 800; font-size: 18px; }
    .wrap { padding: 16px; display: grid; gap: 14px; max-width: 820px; margin: 0 auto; }
    .card { background:#171a21; border:1px solid #2a2f3a; border-radius: 14px; padding: 14px; }
    .sectionTitle { font-weight: 800; margin: 0 0 10px 2px; color:#dfe6f3; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 10px; background:#12151b; border:1px solid #242a35; border-radius: 12px; }
    .denom { font-weight:800; }
    .sub { font-weight:600; color:#aab3c2; font-size: 13px; margin-left: 8px; }
    input { width: 92px; padding: 10px; border-radius: 10px; border:1px solid #2a2f3a; background:#0f1115; color:#f5f6f7; font-size:16px; text-align:right; }
    .totals { display:grid; gap:10px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding: 12px; background:#12151b; border:1px solid #242a35; border-radius: 12px; }
    .big { font-size: 22px; font-weight: 900; }
    button { padding: 12px 14px; border-radius: 12px; border:1px solid #2a2f3a; background:#0f1115; color:#f5f6f7; font-weight:800; font-size:16px; }
    button:active { transform: scale(0.99); }
    .btns { display:flex; gap:10px; flex-wrap:wrap; }
    .hint { color:#aab3c2; font-size: 13px; line-height: 1.35; margin: 10px 2px 0; }
    .field { display:flex; align-items:center; gap:8px; }
    .field span { color:#aab3c2; }
    .muted { color:#aab3c2; }
  </style>
</head>
<body>
  <header>🧾 Till Counter</header>

  <div class="wrap">
    <div class="card">
      <p class="sectionTitle">Bills</p>
      <div class="grid" id="billInputs"></div>
    </div>

    <div class="card">
      <p class="sectionTitle">Loose Coins</p>
      <div class="grid" id="coinInputs"></div>
      <p class="hint">Enter *counts* of loose coins. Rolls are below.</p>
    </div>

    <div class="card">
      <p class="sectionTitle">Coin Rolls <span class="muted">(US standard)</span></p>
      <div class="grid" id="rollInputs"></div>
      <p class="hint">
        Roll values: Pennies $0.50 · Nickels $2.00 · Dimes $5.00 · Quarters $10.00
      </p>
    </div>

    <div class="card totals">
      <div class="row"><span>Till (Bills + Coins + Rolls)</span><span class="big" id="tillTotal">$0.00</span></div>

      <div class="row">
        <span>+ Bank / Drop / Transfer</span>
        <span class="field">$ <input id="bankAdd" inputmode="decimal" placeholder="0.00" style="width:120px;"></span>
      </div>

      <div class="row">
        <span>+ Driver Change</span>
        <span class="field">$ <input id="driverAdd" inputmode="decimal" placeholder="0.00" style="width:120px;"></span>
      </div>

      <div class="row"><span>Grand Total (Till + Extras)</span><span class="big" id="grandTotal">$0.00</span></div>

      <div class="btns">
        <button id="clear">Clear</button>
        <button id="copyGrand">Copy Grand Total</button>
      </div>
      <p class="hint" id="copystatus" style="margin:0 2px;"></p>
    </div>
  </div>

  <script>
    // Bills
    const bills = [
      { key:"ones",     label:"$1",   val:1 },
      { key:"fives",    label:"$5",   val:5 },
      { key:"tens",     label:"$10",  val:10 },
      { key:"twenties", label:"$20",  val:20 },
      { key:"fifties",  label:"$50",  val:50 },
      { key:"hundreds", label:"$100", val:100 },
    ];

    // Loose coins
    const coins = [
      { key:"pennies",  label:"Pennies",  val:0.01 },
      { key:"nickels",  label:"Nickels",  val:0.05 },
      { key:"dimes",    label:"Dimes",    val:0.10 },
      { key:"quarters", label:"Quarters", val:0.25 },
    ];

    // US coin roll totals
    const rolls = [
      { key:"pennyRolls",   label:"Penny Rolls",   val:0.50,  note:"$0.50/roll" },
      { key:"nickelRolls",  label:"Nickel Rolls",  val:2.00,  note:"$2.00/roll" },
      { key:"dimeRolls",    label:"Dime Rolls",    val:5.00,  note:"$5.00/roll" },
      { key:"quarterRolls", label:"Quarter Rolls", val:10.00, note:"$10.00/roll" },
    ];

    const billDiv   = document.getElementById("billInputs");
    const coinDiv   = document.getElementById("coinInputs");
    const rollDiv   = document.getElementById("rollInputs");

    const bankAddEl   = document.getElementById("bankAdd");
    const driverAddEl = document.getElementById("driverAdd");
    const tillEl      = document.getElementById("tillTotal");
    const grandEl     = document.getElementById("grandTotal");
    const statusEl    = document.getElementById("copystatus");

    function money(n){ return n.toLocaleString(undefined,{style:"currency",currency:"USD"}); }
    function num(v){ const x = parseFloat(String(v).replace(/[^\d.-]/g,"")); return Number.isFinite(x)? x: 0; }
    function int(v){ const x = parseInt(String(v).replace(/[^\d-]/g,""),10); return Number.isFinite(x)? x: 0; }

    function buildInputs(list, container, mode="numeric", showNote=false){
      list.forEach(d => {
        const lab = document.createElement("label");
        const note = (showNote && d.note) ? `<span class="sub">${d.note}</span>` : "";
        lab.innerHTML = `
          <span class="denom">${d.label}${note}</span>
          <input id="${d.key}" inputmode="${mode}" placeholder="0" />
        `;
        container.appendChild(lab);
      });
    }

    buildInputs(bills, billDiv, "numeric", false);
    buildInputs(coins, coinDiv, "numeric", false);
    buildInputs(rolls, rollDiv, "numeric", true);

    function save(){
      const data = {};
      [...bills, ...coins, ...rolls].forEach(d => data[d.key] = int(document.getElementById(d.key).value));
      data.bankAdd = num(bankAddEl.value);
      data.driverAdd = num(driverAddEl.value);
      localStorage.setItem("tillCounter", JSON.stringify(data));
    }

    function load(){
      const raw = localStorage.getItem("tillCounter");
      if(!raw) return;
      try{
        const data = JSON.parse(raw);
        [...bills, ...coins, ...rolls].forEach(d => {
          document.getElementById(d.key).value = data[d.key] ?? "";
        });
        bankAddEl.value = (data.bankAdd ?? "") === 0 ? "" : (data.bankAdd ?? "");
        driverAddEl.value = (data.driverAdd ?? "") === 0 ? "" : (data.driverAdd ?? "");
      }catch{}
    }

    function calc(){
      let till = 0;

      bills.forEach(d => till += int(document.getElementById(d.key).value) * d.val);
      coins.forEach(d => till += int(document.getElementById(d.key).value) * d.val);
      rolls.forEach(d => till += int(document.getElementById(d.key).value) * d.val);

      const grand = till + num(bankAddEl.value) + num(driverAddEl.value);

      tillEl.textContent = money(till);
      grandEl.textContent = money(grand);

      save();
    }

    document.body.addEventListener("input", calc);

    document.getElementById("clear").addEventListener("click", () => {
      [...bills, ...coins, ...rolls].forEach(d => document.getElementById(d.key).value = "");
      bankAddEl.value = "";
      driverAddEl.value = "";
      statusEl.textContent = "";
      calc();
    });

    document.getElementById("copyGrand").addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(grandEl.textContent);
        statusEl.textContent = "Copied grand total to clipboard.";
      }catch{
        statusEl.textContent = "Auto-copy blocked (classic iOS mood). Screenshot works too.";
      }
      setTimeout(()=> statusEl.textContent="", 2000);
    });

    load();
    calc();
  </script>
</body>
</html>
